[project]
name = "fix-uv-jupytext"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT" 
license-files = ["LICENSE"]
authors = [
    { name = "Frank Ligterink", email = "frank.ligterink@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
fix-uv-jupytext = "fix_uv_jupytext:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "nbclient>=0.11.0",
    "pip>=26.2.1",
]

[tool.jupytext]
formats = "ipynb,qmd"
