[project]
name = "{{ cookiecutter.package_name }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.description }}"
readme = "README.md"
license = "MIT" 
license-files = ["LICENSE"]
authors = [
    { name = "{{ cookiecutter.author_name }}" }
]
requires-python = ">=3.14"
dependencies = []

#[project.scripts]
#fix-uv-jupytext = "fix_uv_jupytext:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.14"]
build-backend = "uv_build"

# these new jupytext settings below should improve 
# the compatibility between vscode (koen) and jupterlab (frank)
#[tool.jupytext]
#formats = "ipynb,qmd" 

[[tool.jupytext.formats]]
"notebooks/" = "qmd"

[[tool.jupytext.formats]]
"src/{{ cookiecutter.package_name.lower().replace('-', '_') }}/" = "py:percent"


