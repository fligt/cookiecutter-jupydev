project:
  type: website
  output-dir: "../docs/"

format:
  html:
    theme: default
    css: custom.css

website:
  title: "{{ cookiecutter.package_name }}"
  page-navigation: true
  navbar:
    background: primary
    search: true
    right: 
      - icon: github
        href: "{{ cookiecutter.github_url }}"
  sidebar:
    style: floating
    contents: auto
  page-footer: "{% now 'local', '%Y' %} Rijkserfgoedlaboratorium Amsterdam"
