# This jupytext.toml configuration file should enforce automatic pairing of various notebook formats 
# Documentation classic ipynb notebooks get paired to or (actually registered as) quarto qmd markdown notebooks 
[[formats]]
"notebooks/" = "qmd"


# Python modules registered as py:percent text notebooks? 
# Can this work without pairing to another format?  
[[formats]]
"src/{{ cookiecutter.package_name.lower().replace('-', '_') }}/" = "py:percent"
